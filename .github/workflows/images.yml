name: Build & Publish Docker Images
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'services/**'
      - '.dockerignore'
      - 'package.json'
      - 'yarn.lock'
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  OS20: ghcr.io/omyvnss/os20
  LEADGEN: ghcr.io/omyvnss/os20-leadgen

jobs:
  build:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.OS20 }}:latest-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: services/os20-leadgen
          file: services/os20-leadgen/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.LEADGEN }}:latest-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge os20 multi-arch index
        run: |
          docker buildx imagetools create \
            -t ${{ env.OS20 }}:latest \
            ${{ env.OS20 }}:latest-amd64 \
            ${{ env.OS20 }}:latest-arm64
      - name: Merge os20-leadgen multi-arch index
        run: |
          docker buildx imagetools create \
            -t ${{ env.LEADGEN }}:latest \
            ${{ env.LEADGEN }}:latest-amd64 \
            ${{ env.LEADGEN }}:latest-arm64
