name: Build & Publish Docker Images
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'services/**'
      - '.dockerignore'
      - 'package.json'
      - 'yarn.lock'
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  OS20_IMAGE: ghcr.io/omyvnss/os20
  LEADGEN_IMAGE: ghcr.io/omyvnss/os20-leadgen
jobs:
  build:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.OS20_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: services/os20-leadgen
          file: services/os20-leadgen/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.LEADGEN_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
